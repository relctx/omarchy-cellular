# Omarchy Cellular configuration
# Read by omarchy-cellular, which applies it to the NetworkManager profile.
# Plain KEY=VALUE lines only — this file is parsed, never sourced as shell.

# Access Point Name. All four Polish operators (Plus, Play, Orange, T-Mobile)
# use "internet". Change if your carrier requires something else.
APN=internet

# ipv4 | ipv6 | ipv4v6
IP_TYPE=ipv4v6

# Which modem to drive, on a machine with more than one. Match by primary
# port name (wwan1mbim0) or IMEI. Empty means the first modem ModemManager
# lists — the only one, on a single-modem machine.
DEVICE=

# Which SIM slot to make primary on connect.
#   1 = physical SIM card
#   2 = built-in eSIM
# Empty leaves the modem on whichever slot it is already using.
SIM_SLOT=

# Optional APN credentials (most carriers need neither).
APN_USER=
APN_PASS=

# SIM PIN. Leave empty if the card has no PIN.
# NOTE: this file is chmod 600 — still, prefer disabling the PIN on the card.
PIN=

# Default-route metric — this is what makes Wi-Fi win over cellular.
# Omarchy uses 20 for ethernet and 600 for Wi-Fi; the lowest metric wins, so at
# 700 the modem only carries traffic when nothing better has a default route.
# Drop Wi-Fi and failover to mobile is instant (the modem stays connected);
# reconnect Wi-Fi and traffic moves straight back. Raising this above 600 is the
# whole mechanism — do not set it below the Wi-Fi metric.
ROUTE_METRIC=700

# Tell other software this connection costs money (yes|no).
# Applications that honor it defer downloads and background updates; pacman
# and most CLI tools ignore it entirely, so the data cap above is what actually
# stops traffic. Set "no" on a large or freshly topped-up plan.
METERED=yes

# Route mobile above every other link, instead of below them (yes|no).
# The metric is computed from the routes actually present when the connection
# comes up, so it does not assume anyone else's defaults. VPNs route by policy
# rule and are unaffected either way.
PREFER_CELLULAR=no

# Allow data while roaming (yes|no).
ALLOW_ROAMING=yes

# Force registration to one operator by MCC+MNC, e.g. 26006 for Play.
# Leave empty to let the modem choose.
OPERATOR_ID=

# Let the modem connect automatically at boot (yes|no).
# Changing this needs `omarchy-cellular autoconnect on|off` to take effect.
AUTOCONNECT=yes

# Data cap with auto-cutoff: cellular disconnects when this much traffic
# has been used in the current billing period. Examples: 5G, 1.5G, 500M.
# "off" disables the cutoff; usage is tracked and shown either way.
DATA_LIMIT=off

# Billing period for the cap: monthly or daily.
DATA_PERIOD=monthly

# Day of the month the package renews and the counter resets (1-31; days
# past the end of a short month clamp to its last day).
DATA_RESET_DAY=1
